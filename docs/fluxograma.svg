<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1290" width="800" height="1290" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <title>Fluxo do robô FIRMS Monitor</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <style>
      .proc { fill:#eef4ff; stroke:#3b6fd8; stroke-width:1.5; }
      .dec  { fill:#fff6d6; stroke:#c99a06; stroke-width:1.5; }
      .err  { fill:#fdecec; stroke:#c0392b; stroke-width:1.5; }
      .alrt { fill:#fff0e0; stroke:#e07b00; stroke-width:1.8; }
      .rep  { fill:#eaf7ee; stroke:#2e8b57; stroke-width:1.5; }
      .lin  { fill:none; stroke:#4a4a4a; stroke-width:1.4; marker-end:url(#seta); }
      .lbl  { fill:#1f2933; text-anchor:middle; }
      .yes  { fill:#2e7d32; font-weight:600; font-size:12px; }
      .no   { fill:#c0392b; font-weight:600; font-size:12px; }
      .lane { fill:#6b7280; font-size:11px; letter-spacing:.5px; }
    </style>
  </defs>

  <!-- Início -->
  <circle cx="300" cy="35" r="17" fill="#d9f2df" stroke="#2e8b57" stroke-width="2"/>
  <text x="300" y="39" class="lbl" font-size="11">Início</text>
  <line x1="300" y1="52" x2="300" y2="78" class="lin"/>

  <!-- 1 Disparo -->
  <rect x="150" y="80" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="101" class="lbl"><tspan font-weight="600">Disparo do robô</tspan></text>
  <text x="300" y="119" class="lbl" font-size="12">manual (CLI) · agendamento · MVP Merlin</text>
  <line x1="300" y1="132" x2="300" y2="158" class="lin"/>

  <!-- 2 Configuração -->
  <rect x="150" y="160" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="181" class="lbl"><tspan font-weight="600">Carregar configuração</tspan></text>
  <text x="300" y="199" class="lbl" font-size="12">.env: chave, área, faixas de FRP, nível de alerta</text>
  <line x1="300" y1="212" x2="300" y2="236" class="lin"/>

  <!-- D1 Configuração válida? -->
  <polygon points="300,238 410,273 300,308 190,273" class="dec"/>
  <text x="300" y="277" class="lbl">Configuração válida?</text>
  <line x1="410" y1="273" x2="518" y2="273" class="lin"/>
  <text x="460" y="266" class="no">não</text>
  <rect x="520" y="250" width="230" height="46" rx="9" class="err"/>
  <text x="635" y="269" class="lbl" font-weight="600">Mensagem de erro</text>
  <text x="635" y="286" class="lbl" font-size="12">encerra com código 2</text>
  <line x1="635" y1="296" x2="635" y2="318" class="lin"/>
  <circle cx="635" cy="333" r="13" fill="#fdecec" stroke="#c0392b" stroke-width="3"/>
  <line x1="300" y1="308" x2="300" y2="336" class="lin"/>
  <text x="314" y="327" class="yes">sim</text>

  <!-- 3 Consultar API -->
  <rect x="150" y="338" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="359" class="lbl"><tspan font-weight="600">Consultar API NASA FIRMS</tspan></text>
  <text x="300" y="377" class="lbl" font-size="12">HTTPS · área do Brasil · novas tentativas</text>
  <line x1="300" y1="390" x2="300" y2="414" class="lin"/>

  <!-- D2 Resposta válida? -->
  <polygon points="300,416 410,451 300,486 190,451" class="dec"/>
  <text x="300" y="455" class="lbl">Resposta válida?</text>
  <line x1="410" y1="451" x2="518" y2="451" class="lin"/>
  <text x="460" y="444" class="no">não</text>
  <rect x="520" y="428" width="230" height="46" rx="9" class="err"/>
  <text x="635" y="447" class="lbl" font-weight="600">Registrar erro no log</text>
  <text x="635" y="464" class="lbl" font-size="12">chave mascarada · código 1</text>
  <line x1="635" y1="474" x2="635" y2="496" class="lin"/>
  <circle cx="635" cy="511" r="13" fill="#fdecec" stroke="#c0392b" stroke-width="3"/>
  <line x1="300" y1="486" x2="300" y2="514" class="lin"/>
  <text x="314" y="505" class="yes">sim</text>

  <!-- 4 Converter -->
  <rect x="150" y="516" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="537" class="lbl"><tspan font-weight="600">Converter CSV em focos</tspan></text>
  <text x="300" y="555" class="lbl" font-size="12">linhas inválidas são ignoradas e registradas</text>
  <line x1="300" y1="568" x2="300" y2="592" class="lin"/>

  <!-- 5 Filtros -->
  <rect x="150" y="594" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="615" class="lbl"><tspan font-weight="600">Identificar focos ativos</tspan></text>
  <text x="300" y="633" class="lbl" font-size="12">confiança mínima + território BR (IBGE)</text>
  <line x1="300" y1="646" x2="300" y2="670" class="lin"/>

  <!-- 6 Deduplicar -->
  <rect x="150" y="672" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="693" class="lbl"><tspan font-weight="600">Descartar focos já registrados</tspan></text>
  <text x="300" y="711" class="lbl" font-size="12">comparação pelo ID no CSV</text>
  <line x1="300" y1="724" x2="300" y2="748" class="lin"/>

  <!-- D3 Há focos novos? -->
  <polygon points="300,750 410,785 300,820 190,785" class="dec"/>
  <text x="300" y="789" class="lbl">Há focos novos?</text>
  <polyline points="410,785 770,785 770,1153 452,1153" class="lin"/>
  <text x="460" y="778" class="no">não</text>
  <line x1="300" y1="820" x2="300" y2="848" class="lin"/>
  <text x="314" y="839" class="yes">sim</text>

  <!-- 7 Classificar -->
  <rect x="150" y="850" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="871" class="lbl"><tspan font-weight="600">Classificar risco pelo FRP</tspan></text>
  <text x="300" y="889" class="lbl" font-size="12">Baixo &lt;10 · Médio &lt;50 · Alto &lt;100 · Crítico ≥100</text>
  <line x1="300" y1="902" x2="300" y2="926" class="lin"/>

  <!-- 8 Registrar -->
  <rect x="150" y="928" width="300" height="52" rx="9" class="proc"/>
  <text x="300" y="949" class="lbl"><tspan font-weight="600">Registrar ocorrências</tspan></text>
  <text x="300" y="967" class="lbl" font-size="12">CSV de auditoria (data/ocorrencias.csv)</text>
  <line x1="300" y1="980" x2="300" y2="1004" class="lin"/>

  <!-- D4 Nível ≥ alerta? -->
  <polygon points="300,1006 410,1041 300,1076 190,1041" class="dec"/>
  <text x="300" y="1037" class="lbl">Nível ≥</text>
  <text x="300" y="1053" class="lbl">ALERT_MIN_LEVEL?</text>
  <line x1="410" y1="1041" x2="498" y2="1041" class="lin"/>
  <text x="452" y="1034" class="yes">sim</text>
  <rect x="500" y="1012" width="240" height="60" rx="9" class="alrt"/>
  <text x="620" y="1033" class="lbl" font-weight="600">Notificar ocorrências críticas</text>
  <text x="620" y="1050" class="lbl" font-size="12">alerta no console/log</text>
  <text x="620" y="1065" class="lbl" font-size="12">Merlin: aviso por voz + mapa</text>
  <polyline points="620,1072 620,1153" class="lin" style="marker-end:none"/>
  <line x1="300" y1="1076" x2="300" y2="1126" class="lin"/>
  <text x="314" y="1100" class="no">não</text>

  <!-- 9 Resumo -->
  <rect x="150" y="1128" width="300" height="52" rx="9" class="rep"/>
  <text x="300" y="1149" class="lbl"><tspan font-weight="600">Relatório consolidado do ciclo</tspan></text>
  <text x="300" y="1167" class="lbl" font-size="12">coletados · ativos · novos · alertas · níveis</text>
  <line x1="300" y1="1180" x2="300" y2="1214" class="lin"/>

  <!-- Fim -->
  <circle cx="300" cy="1232" r="17" fill="#fdecec" stroke="#c0392b" stroke-width="3"/>
  <text x="300" y="1236" class="lbl" font-size="11">Fim</text>

  <!-- Legenda -->
  <g transform="translate(20,1262)" font-size="11">
    <rect width="14" height="10" rx="2" class="proc"/><text x="20" y="9">Atividade</text>
    <rect x="95" width="14" height="10" class="dec"/><text x="115" y="9">Decisão</text>
    <rect x="180" width="14" height="10" rx="2" class="err"/><text x="200" y="9">Exceção</text>
    <rect x="265" width="14" height="10" rx="2" class="alrt"/><text x="285" y="9">Notificação</text>
    <rect x="365" width="14" height="10" rx="2" class="rep"/><text x="385" y="9">Relatório</text>
  </g>
</svg>
